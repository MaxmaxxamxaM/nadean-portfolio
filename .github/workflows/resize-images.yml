name: Resize uploaded photos

on:
  push:
    branches: [main]
    paths: ["images/**"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: resize-images
  cancel-in-progress: false

jobs:
  resize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Shrink photos over 3000px
        run: |
          pip install --quiet "pillow>=11"
          python .github/scripts/resize_images.py

      - name: Commit resized photos
        id: commit
        run: |
          if git diff --quiet -- images; then
            echo "Nothing to resize."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images
          git commit -m "Resize uploaded photos for the web"
          # Retry in case a new save from Pages CMS landed while this ran
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            sleep 5
          done
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Republish the site
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages will pick up the change on the next save."
